  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('med_theme');
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.content = (t === 'light' || t === 'dark') ? t : 'light dark';
        var resolved = (t === 'light' || t === 'dark') ? t : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', resolved);
        var s = parseFloat(localStorage.getItem('med_font_scale'));
        if (!isNaN(s) && s >= 0.8 && s <= 1.4) document.documentElement.style.setProperty('--font-scale', String(s));
      } catch (e) {}
    })();
  </script>
