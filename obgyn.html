<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>زنان و زایمان (بکمن و لینگ ویرایش ۹) | مدیکالیسم البرز</title>
  <meta name="description" content="درسنامه بومی V2 زنان و زایمان بر اساس بکمن و لینگ ۹ با تایم‌لاین تعاملی سن بارداری، اسکورینگ بالینی، دستورات کشیک و مرور شب امتحان." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230d9488%22/><text y=%22.9em%22 x=%2214%22 font-size=%2268%22>🩺</text></svg>" />

  <!-- Zero-FOUC Theme, Color-Scheme, Zoom & Reduced-Motion Init -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('med_theme');
        var d = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.content = (t === 'light' || t === 'dark') ? t : 'light dark';
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        var s = parseFloat(localStorage.getItem('med_font_scale'));
        if (!isNaN(s) && s >= 0.8 && s <= 1.4) {
          document.documentElement.style.setProperty('--font-scale', String(s));
        }
        if (localStorage.getItem('med_reduced_motion') === 'true') {
          document.documentElement.classList.add('v2-reduced-motion');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Non-blocking Vazirmatn + Google Sans for LTR Clinical Terms (Sahel / Shabnam lazy-loaded on demand by UniversalShell) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" onload="this.onload=null;this.rel='stylesheet'" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" />
  </noscript>

  <!-- Unified V2 Design System & Native V2 Course Engine Styles -->
  <link rel="stylesheet" href="./css/design-system-v2.css?v=20261121c" />
  <link rel="stylesheet" href="./css/course-v2.css?v=20261121c" />
</head>
<body>
  <!-- GPU Reading Progress Bar -->
  <div class="reading-progress-bar-container" aria-hidden="true">
    <div class="reading-progress-bar" id="readingProgressBar"></div>
  </div>

  <div class="v2-app-shell">
    <!-- Minimalist Course Header -->
    <header class="v2-header">
      <div class="v2-header-start">
        <button type="button" class="v2-mobile-nav-btn" id="mobileNavToggle" aria-label="باز کردن فهرست فصول">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <a href="./index.html" class="v2-icon-btn" title="بازگشت به خانه مدیکالیسم" aria-label="بازگشت به خانه">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>

        <a href="./index.html" class="v2-brand">
          <span class="v2-brand-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
            </svg>
          </span>
          <span class="v2-brand-titles">
            <span class="v2-brand-name" style="display:block;">زنان و زایمان (بکمن و لینگ ۹)</span>
            <span class="v2-brand-sub" style="display:block;">موتور درسنامه بومی V2 • ۵۰ فصل استاندارد بالینی</span>
          </span>
        </a>
      </div>

      <div class="v2-header-actions">
        <button type="button" class="v2-search-trigger btn-search-trigger" aria-label="جستجو در درسنامه">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>جستجو در فصل‌ها...</span>
          <span class="search-shortcut-badge">⌘K</span>
        </button>

        <button type="button" class="v2-cram-btn" id="examCramToggleBtn" style="display:none;" aria-pressed="false" title="فیلتر نکات حیاتی شب امتحان">
          <span>⚡</span>
          <span class="v2-cram-label">شب امتحان</span>
        </button>

        <button type="button" class="v2-icon-btn" id="highlightsToggleBtn" title="هایلایت‌های من" aria-label="هایلایت‌های من">
          <span>🖍️</span>
          <span class="v2-count-pill" id="highlightsCountBadge"></span>
        </button>

        <button type="button" class="v2-icon-btn" id="bookmarksToggleBtn" title="نشانک‌های من" aria-label="نشانک‌های من">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="v2-count-pill" id="bookmarksCountBadge"></span>
        </button>

        <button type="button" class="v2-settings-trigger" id="v2SettingsBtn" data-v2-settings-trigger aria-label="تنظیمات و پروفایل">
          <span class="v2-settings-avatar" aria-hidden="true">⚙️</span>
          <span class="v2-settings-label-text">تنظیمات و پروفایل</span>
        </button>
      </div>
    </header>

    <!-- Main Two-Column Course Layout -->
    <div class="v2-layout">
      <!-- Desktop Table of Contents Sidebar -->
      <aside class="v2-sidebar" aria-label="فهرست فصل‌های زنان و زایمان">
        <div class="v2-sidebar-header">
          <span class="v2-sidebar-title">سرفصل‌های زنان و زایمان</span>
          <a href="./quiz.html" style="font-size:11.5px;font-weight:700;color:var(--accent-primary);text-decoration:none;">آزمونک‌ها ←</a>
        </div>

        <div class="v2-progress-box">
          <div class="v2-progress-meta">
            <span>پیشرفت مطالعه</span>
            <span id="studyProgressStats">۰ از ۱ فصل</span>
          </div>
          <div class="v2-progress-track">
            <div class="v2-progress-fill" id="studyProgressFill" style="width:0%"></div>
          </div>
        </div>

        <nav class="v2-sidebar-scroll" aria-label="ناوبری فصل‌ها">
          <ul id="desktopNavTree" style="margin:0;padding:0;list-style:none;"></ul>
        </nav>
      </aside>

      <!-- Active Chapter Content Area (On-Demand Chunk Rendered by CourseEngineV2) -->
      <main class="v2-content" id="chapterContentArea">
        <div style="padding:48px 20px;text-align:center;color:var(--text-muted);">در حال بارگذاری درسنامه...</div>
      </main>
    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <div class="v2-drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="v2-mobile-drawer" id="mobileDrawer" aria-label="منوی موبایل درسنامه">
    <div class="v2-sidebar-header">
      <span class="v2-sidebar-title">فصل‌های زنان و زایمان</span>
      <button type="button" class="v2-icon-btn" id="drawerCloseBtn" aria-label="بستن منو">✕</button>
    </div>

    <div style="padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border-subtle);">
      <button type="button" class="v2-search-trigger btn-search-trigger" style="display:inline-flex;flex:1;justify-content:center;">
        <span>🔍 جستجو...</span>
      </button>
      <button type="button" class="v2-icon-btn" id="mobileHighlightsBtn" title="هایلایت‌های من" aria-label="هایلایت‌های من">
        <span>🖍️</span>
        <span class="v2-count-pill" id="mobileHighlightsCountBadge"></span>
      </button>
      <button type="button" class="v2-cram-btn" id="mobileExamCramToggleBtn" style="display:none;" aria-pressed="false">
        <span>⚡</span><span>شب امتحان</span>
      </button>
    </div>

    <div class="v2-progress-box">
      <div class="v2-progress-meta">
        <span>پیشرفت مطالعه</span>
        <span id="mobileStudyProgressStats">۰ از ۱ فصل</span>
      </div>
      <div class="v2-progress-track">
        <div class="v2-progress-fill" id="mobileStudyProgressFill" style="width:0%"></div>
      </div>
    </div>

    <nav class="v2-sidebar-scroll" aria-label="فهرست موبایل">
      <ul id="mobileNavTree" style="margin:0;padding:0;list-style:none;"></ul>
    </nav>
  </aside>

  <!-- Search Modal -->
  <div class="v2-modal-backdrop" id="searchModalBackdrop" role="dialog" aria-modal="true" aria-label="جستجو در درسنامه">
    <div class="v2-modal-card">
      <div class="v2-modal-head">
        <input type="text" id="searchInput" placeholder="جستجو بر اساس عنوان، دارو، معیار بالینی..." style="flex:1;border:1px solid var(--border-default);background:var(--bg-surface-secondary);color:var(--text-primary);padding:9px 12px;border-radius:10px;font-family:inherit;font-size:13.5px;outline:none;" />
        <button type="button" class="v2-icon-btn" id="searchCloseBtn" aria-label="بستن جستجو">✕</button>
      </div>
      <div class="v2-modal-list" id="searchResultsList"></div>
    </div>
  </div>

  <!-- Bookmarks Modal -->
  <div class="v2-modal-backdrop" id="bookmarksModalBackdrop" role="dialog" aria-modal="true" aria-label="نشانک‌های من">
    <div class="v2-modal-card">
      <div class="v2-modal-head">
        <strong style="font-size:14.5px;">🔖 نشانک‌های من</strong>
        <button type="button" class="v2-icon-btn" id="bookmarksCloseBtn" aria-label="بستن نشانک‌ها">✕</button>
      </div>
      <div class="v2-modal-list" id="bookmarksList"></div>
    </div>
  </div>

  <!-- Highlights Modal -->
  <div class="v2-modal-backdrop" id="highlightsModalBackdrop" role="dialog" aria-modal="true" aria-label="هایلایت‌های من">
    <div class="v2-modal-card">
      <div class="v2-modal-head">
        <div style="display:flex;align-items:center;gap:8px;">
          <strong style="font-size:14.5px;">🖍️ هایلایت‌های من</strong>
          <span id="highlightsModalCountPill" style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:9999px;background:var(--accent-primary-subtle);color:var(--accent-primary);">۰ مورد</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button type="button" class="btn-delete-hl" id="clearAllHighlightsBtn">پاک کردن همه</button>
          <button type="button" class="v2-icon-btn" id="highlightsCloseBtn" aria-label="بستن هایلایت‌ها">✕</button>
        </div>
      </div>
      <div class="v2-modal-list" id="highlightsList"></div>
    </div>
  </div>

  <!-- Scripts (file:// and https:// compatible dynamic script loading) -->
  <script src="./js/universal-shell.js?v=20261121c"></script>
  <script src="./data/obgyn/index.js?v=20261121c"></script>
  <script src="./js/course-engine-v2.js?v=20261121c"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.CourseEngineV2) {
        window.CourseEngineV2.init({
          courseId: 'obgyn',
          courseTitle: 'زنان و زایمان (بکمن و لینگ ۹)'
        });
      }
    });
  </script>
</body>
</html>
